; ===========================================================================
;  SumatraLister.ini  --  optional settings for the SumatraLister plugin
;
;  Place this file in the SAME folder as SumatraLister.wlx / .wlx64.
;  Every setting is optional; delete or leave blank anything you don't need.
;  Changes take effect the next time Total Commander loads the plugin
;  (restart TC, or close and reopen the Lister window after it has been
;  unloaded). Lines starting with ';' are comments.
;
;  COMPATIBILITY: this plugin shows SumatraPDF inside Total Commander using
;  Sumatra's "-plugin <window>" command-line mode. SumatraPDF's current
;  command-line reference no longer lists that option, and other plugins
;  that embed Sumatra this way report problems with newer versions. If the
;  pane shows a message about SumatraPDF exiting or not appearing, see
;  README.md ("Compatibility") before changing anything here.
;
;  A NOTE ON QUOTES: Windows' INI reader silently discards ONE pair of
;  matching quotes that wrap an entire value. That is harmless (even handy)
;  for a plain path such as SumatraPath, but it corrupts any value that
;  both starts AND ends with a quote and has more quoting inside it -- e.g.
;      InverseSearchCommand="C:\Program Files\Editor\ed.exe" -n%l "%f"
;  would silently become   C:\Program Files\Editor\ed.exe" -n%l "%f
;  (adding a trailing space does NOT prevent this). The fix is to wrap the
;  whole value in SINGLE quotes, which are the ones that get discarded:
;      InverseSearchCommand='"C:\Program Files\Editor\ed.exe" -n%l "%f"'
;  A value that merely contains quotes in the middle, or ends with something
;  other than a quote, is left untouched.
; ===========================================================================

[Settings]

; Full path to SumatraPDF.exe. Leave blank to auto-detect (registry,
; common install folders, this plugin's own folder, then the folders listed
; in PATH -- never the current directory).
SumatraPath=

; Extra arguments appended verbatim to every embedded SumatraPDF launch,
; e.g.:  -html-backend ie   (Sumatra 3.7+: use the older IE control instead
; of WebView2 to show CHM and Markdown).
; Avoid -esc-to-exit: it is deprecated, and Esc would then END the embedded
; Sumatra, which the plugin would report as an unexpected exit. Sumatra
; treats anything it doesn't recognise as an option as a FILE NAME, so
; double-check spellings.
ExtraArgs=

; 1 = launch Sumatra with -restrict. Per Sumatra's documentation this turns
; EVERY restricted-use feature off, as if an empty restrictions file were
; present: access to the file system, registry and internet (so, for example,
; links in documents will not open), printing, copying selected text, and
; saving Sumatra's settings and recent files. That suits previewing
; untrusted files -- but it also means Lister's Copy and Print commands will
; not work, and silent printing fails with Sumatra's exit code 6 ("disabled
; by restriction policy"). Sumatra's "Configure for restricted use" page
; explains how to allow individual features again.
RestrictMode=0

; 1 = launch Sumatra with -invertcolors (night-reading mode). Sumatra
; documents it as affecting only the current run, but lists it among its
; deprecated options (as -invert-colors), so a future version may drop it.
; Ignored (together with any per-extension NightMode below) when
; AutoNightMode=1.
NightMode=0

; 1 = follow Total Commander's own Lister light/dark theme instead of a
; fixed NightMode: the plugin relaunches Sumatra with/without
; -invertcolors when TC's dark-mode state changes. Overrides NightMode and
; every per-extension NightMode setting while on. Requires a Total
; Commander version that sends the dark-mode notification (TC 10+).
AutoNightMode=0

; Default zoom passed via -zoom: fit page | fit width | fit height |
; fit content | fit visible | or a percentage such as 100 or 150
DefaultZoom=

; Default view mode passed via -view. Sumatra's documented names are:
;   single page | continuous single page | facing | continuous facing |
;   book view | continuous book view
; (A plain "continuous" -- which earlier versions of this file suggested -- is
; accepted too and sent as "continuous single page".)
DefaultView=

; Page-surround background color passed via -bg-color, as a hex RGB value
; (e.g. #2B2B2B for a dark gray; Sumatra documents the form with the '#', and
; a bare 2B2B2B gets it added for you). This is the color of the area AROUND the
; page in continuous-scroll mode, distinct from NightMode/-invertcolors
; (which inverts the page/text content itself, and does NOT have the
; persistence behavior described below). Leave blank for Sumatra's own
; default.
;
; IMPORTANT: -bg-color is one of a small set of SumatraPDF command-line
; options that Sumatra's own documentation describes as only setting a
; value in your SumatraPDF-settings.txt (the MainWindowBackground value) --
; every time this plugin launches Sumatra with a BackgroundColor= set, it
; permanently updates that setting, not just the current session. This
; means it also affects how Sumatra looks when you use it standalone,
; outside this plugin, until changed again. Sumatra's docs also mark
; -bg-color itself as deprecated in favor of that same setting, so this
; still works today but isn't guaranteed to in a future SumatraPDF version.
; Leave this blank unless you're fine with that persistent, plugin-external
; side effect -- or give the plugin its own settings folder (SettingsDir,
; below), which confines the write to a private file.
BackgroundColor=

; SyncTeX / PdfSync inverse-search command, forwarded to -inverse-search.
; It makes DOUBLE-CLICKING a spot in the PDF jump back to the matching line
; of your LaTeX source in your editor. Requirements: the PDF must have
; SyncTeX data next to it (compile with -synctex=1, which produces a
; .synctex.gz file) -- without it Sumatra reports "No synchronization info
; at this position". In some Sumatra versions the feature is also gated by
; Sumatra's own EnableTeXEnhancements setting; if double-clicking does
; nothing, check that. %f is replaced by Sumatra with the source file path
; and %l with the line number. Examples (note the SINGLE quotes wrapping
; each whole value -- see "A NOTE ON QUOTES" at the top of this file for
; why they are required whenever the value both starts and ends with a
; double quote):
;   InverseSearchCommand='"C:\Program Files\Microsoft VS Code\Code.exe" -g "%f":%l'
;   InverseSearchCommand='"C:\Program Files\Notepad++\notepad++.exe" -n%l "%f"'
;   InverseSearchCommand=code.exe -g "%f":%l
;
; PREFERRED ALTERNATIVE: set it once in Sumatra itself and leave this blank.
; Depending on your Sumatra version that is Ctrl+K in a running Sumatra
; window followed by "Set Inverse Search Command Line", or its Settings /
; Options dialog. That is what Sumatra's own documentation recommends, and
; it avoids the persistence side effect described next.
;
; NOTE on persistence: Sumatra's current documentation lists -inverse-search
; as an ordinary option (it is not marked deprecated) and does not say
; whether using it writes to your settings file. But this command line is
; Sumatra's own InverseSearchCmdLine setting, so assume that passing it on
; every launch stores it there -- older versions of Sumatra's documentation
; said so outright -- which would also affect Sumatra when you use it outside
; this plugin. Setting it once inside Sumatra (above), or giving the plugin
; its own settings folder (SettingsDir, below), avoids that. The command
; itself is later parsed by Sumatra, which applies its OWN quoting rules,
; separate from this file's.
InverseSearchCommand=

; Comma-separated allowlist of extensions this plugin should claim, e.g.
; "PDF,EPUB,CBZ". Leave blank (default) to keep everything enabled that the
; plugin claims by default -- PDF AI EPUB MOBI PRC AZW AZW3 FB2 FB2Z FBZ ZFB2
; DJVU DJV CHM XPS OXPS OFD CB7 CBR CBT CBZ -- plus anything you add with
; ExtraExtensions below. This setting only TRIMS that combined list; it never
; adds anything.
; Caution: a non-blank value that matches nothing (a typo, or entries
; separated by spaces instead of commas) enables NOTHING -- by design.
EnabledExtensions=

; Extra file types to claim, beyond the default list above -- for formats
; SumatraPDF can open but this plugin doesn't claim by default. The plugin
; doesn't restrict this to a fixed list: it hands the file to Sumatra, so
; whatever YOUR Sumatra opens will work, and the list never goes stale when
; Sumatra adds formats. Comma-separated; each entry is 1-10 letters/digits,
; with or without a leading dot (e.g. "md, .ofd"). Invalid entries are
; ignored and logged (DebugLog=1). Example:   ExtraExtensions=MD,CAJ
; A per-extension section (see the bottom of this file) works for these too.
;
; Per SumatraPDF's own "Supported document formats" page (checked November
; 2026 -- Sumatra's list grows between versions, so check yours), types you
; might add, and why they are NOT claimed by default:
;   Markdown          MD MARKDOWN     RENDERED, not shown as source: Sumatra
;                                     displays GitHub-flavored Markdown through an
;                                     embedded browser (WebView2 when installed,
;                                     otherwise the older IE control; Sumatra 3.7+
;                                     can force either with -html-backend). It is
;                                     off by default only because claiming MD
;                                     replaces Total Commander's own text viewer
;                                     for EVERY .md file -- turn it on if you
;                                     would rather see them rendered. (CHM, which
;                                     IS claimed by default, uses the same browser.)
;   Plain text        TXT LOG NFO TCR   same reason
;   Images            PNG JPG JPEG GIF BMP TIF TIFF WEBP ICO TGA AVIF HEIC JXL ...
;                                     Total Commander has a fast built-in
;                                     image viewer
;   RTF               RTF             needs Sumatra 3.7+; other viewers often own it
;   SVG               SVG             usually owned by other tools
;   CAJ / KDH / NH    CAJ KDH NH      (CNKI) 64-bit Windows only. The first time
;                                     one is opened Sumatra offers to download
;                                     a converter -- open one once in Sumatra
;                                     itself first, not inside a preview pane
;   Palm DOC          PDB             .pdb is also the debug-symbol format that
;                                     developers have plenty of
;   Microsoft Reader  LIT             needs Sumatra 3.7+
;   Others            XOD DWFX (XPS-like), DVI (needs TeX, or dvips +
;                     Ghostscript), PS EPS (need Ghostscript), and archives of
;                     images (ZIP RAR 7Z TAR)
; Not a Sumatra format at all: HTML/HTM pages (CHM compiled help is).
; OFD (claimed by default), RTF and LIT need Sumatra 3.7+ -- a pre-release
; build at the time of writing (checked November 2026; the stable release
; was 3.6.1). Opening one on an older Sumatra is noted in the log and
; explained in the pane.
; NOTE: Total Commander may keep the detect string it stored when the plugin
; was first added. After changing this setting, restart Total Commander and,
; if the new types aren't picked up, remove and re-add the plugin or edit its
; detect string in the Lister-plugins dialog.
ExtraExtensions=

; A private settings folder for the SumatraPDF this plugin launches (passed
; as -appdata, which Sumatra documents as the folder for its settings file
; and thumbnail cache). With it, the embedded Sumatra reads and writes ITS
; OWN SumatraPDF-settings.txt there -- window state, recent-file history,
; BackgroundColor / InverseSearchCommand values -- and never touches the
; settings you use when you run SumatraPDF yourself. The same folder is used
; when the plugin starts Sumatra to print; the pop-out window (EnablePopOut)
; deliberately keeps using your normal settings. Environment variables are
; expanded and a relative path is relative to this plugin's folder:
;   SettingsDir=%LOCALAPPDATA%\SumatraLister
; Leave blank (default) to share Sumatra's own settings. A fresh folder starts
; with Sumatra's defaults; to carry your preferences over, copy your
; SumatraPDF-settings.txt into it. (RestrictMode=1 stops Sumatra saving
; settings at all.)
SettingsDir=

; Extra arguments forwarded to -print-settings when printing via this
; plugin's ListPrint support (Total Commander's File > Print on a selected
; file), e.g.: fit | noscale | shrink | landscape | duplex
PrintSettings=

; Controls ListPrint's FALLBACK behavior -- used only when there's no live
; Lister pane already showing the file being printed (the common case
; instead reuses that pane's own Ctrl+P print dialog; see the README).
; 1 = show Sumatra's own interactive print dialog (printer/page-range/
;     copies choice) for the fallback case too; the plugin returns right
;     away rather than waiting for you to finish with it (default).
; 0 = the old silent, non-interactive behavior (-print-to/-print-to-default),
;     which briefly waits for the job to finish before returning -- for
;     scripted/automated printing that can't have a dialog pop up unattended.
;     It returns an error when Sumatra reports a failure, using the exit
;     codes Sumatra documents for command-line printing (the log says which:
;     file couldn't be opened, printing not allowed, printer missing, driver
;     failed, or disabled by RestrictMode). Failures inside the print spooler
;     after the job is accepted cannot be reported this way.
InteractivePrintFallback=1

; 1 = supply real first-page thumbnails to Total Commander's Thumbnails
; view via the Windows Shell thumbnail pipeline (no extra Sumatra process
; is started per thumbnail). 0 = no thumbnails from this plugin.
ThumbnailsEnabled=1

; How long (milliseconds) to wait for Sumatra to embed itself into the
; Lister pane before giving up. Clamped to 500..30000. While waiting, the
; pane shows "Opening in SumatraPDF...". Raise this on a slow machine or
; with very large documents. If Sumatra EXITS before this time (for example
; because this version doesn't support embedding), the plugin notices at once
; and reports it, rather than waiting for the timeout.
EmbedTimeoutMs=4000

; 1 = if Sumatra can't be found or fails to embed (or crashes while the
; file is open), open the file with its default Windows application
; instead, in a separate window, in addition to the explanatory message
; shown in the Lister pane. 0 = just show the message.
FallbackToShellOpen=0

; 1 = register a system-wide hotkey (see PopOutHotkey) that reopens the
; current file in a normal, full SumatraPDF window with its menu/toolbar --
; useful for Save As, annotating, rotating, or anything else the embedded
; view doesn't expose. 0 = disabled (default).
; NOTE: the hotkey is effectively system-wide while a Lister pane using this
; plugin is open, not scoped to just that preview having focus, so it can
; shadow the same combination in other applications -- opt in deliberately,
; and use PopOutHotkey to pick a combination nothing else of yours uses.
EnablePopOut=0

; The combination for EnablePopOut=1. Format: one or more modifiers
; (Ctrl, Alt, Shift, Win) plus exactly ONE key, joined with '+': a letter
; A-Z, a digit 0-9, or a function key F1-F24. Case-insensitive. At least
; one modifier is required (a bare key would be swallowed in every other
; program). Examples:  Ctrl+Alt+O   Ctrl+Shift+F9   Win+Alt+P
; An invalid value falls back to Ctrl+Alt+O (noted in the debug log). If
; another program already owns the combination, registration fails quietly
; (also noted in the debug log) -- pick a different one here.
PopOutHotkey=Ctrl+Alt+O

; 1 = register a system-wide hotkey (see DiagnosticHotkey) that copies a
; diagnostic snapshot to the clipboard -- plugin version, detected
; SumatraPDF path and version, effective settings, and a recent log tail if
; DebugLog=1. Never includes a deep link's pwd or search value, and shows
; InverseSearchCommand only as set/not set. Handy for pasting into a bug
; report. 0 = disabled (default). Same system-wide caveat as EnablePopOut.
EnableDiagnosticHotkey=0

; The combination for EnableDiagnosticHotkey=1; same format and rules as
; PopOutHotkey. An invalid value falls back to Ctrl+Alt+D.
DiagnosticHotkey=Ctrl+Alt+D

; 1 = write SumatraLister.log next to this INI with detection/launch details
; (useful for troubleshooting "Sumatra could not be found" messages). The
; log auto-rotates (starts fresh) once it passes ~2MB.
DebugLog=0

; ---------------------------------------------------------------------------
; Per-extension overrides (optional)
; ---------------------------------------------------------------------------
; An [EXT] section (extension name, no dot -- any type the plugin claims, built in
; or added via ExtraExtensions: PDF, EPUB, CBZ, MD, OFD ...) overrides DefaultZoom/
; DefaultView/NightMode from [Settings] for files of that extension only.
; Any key you don't set in the section falls back to the [Settings] value
; above. (AutoNightMode=1 overrides every static NightMode, including these.)
; Comics and PDFs, for example, often want different defaults:
;
; [CBZ]
; DefaultView=continuous single page
; DefaultZoom=fit width
;
; [CBR]
; DefaultView=continuous single page
; DefaultZoom=fit width
;
; [PDF]
; DefaultView=single page
; DefaultZoom=fit page
