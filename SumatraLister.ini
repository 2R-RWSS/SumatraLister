; ===========================================================================
;  SumatraLister.ini  --  optional settings for the SumatraLister plugin
;
;  Place this file in the SAME folder as SumatraLister.wlx / .wlx64.
;  Every setting is optional; delete or leave blank anything you don't need.
;  Changes take effect the next time Total Commander loads the plugin
;  (restart TC, or close and reopen the Lister window after it has been
;  unloaded). Lines starting with ';' are comments.
;
;  A NOTE ON QUOTES: Windows' INI reader silently discards ONE pair of
;  matching quotes that wrap an entire value. That is harmless (even handy)
;  for a plain path such as SumatraPath, but it corrupts any value that
;  both starts AND ends with a quote and has more quoting inside it -- e.g.
;      InverseSearchCommand="C:\Program Files\Editor\ed.exe" -n%l "%f"
;  would silently become   C:\Program Files\Editor\ed.exe" -n%l "%f
;  (adding a trailing space does NOT prevent this). The fix is to wrap the
;  whole value in SINGLE quotes, which are the ones that get discarded:
;      InverseSearchCommand='"C:\Program Files\Editor\ed.exe" -n%l "%f"'
;  A value that merely contains quotes in the middle, or ends with something
;  other than a quote, is left untouched.
; ===========================================================================

[Settings]

; Full path to SumatraPDF.exe. Leave blank to auto-detect (registry,
; common install folders, this plugin's own folder, then PATH).
SumatraPath=

; Extra arguments appended verbatim to every embedded SumatraPDF launch,
; e.g.:  -esc-to-exit
ExtraArgs=

; 1 = launch Sumatra with -restrict (sandboxed: no file saving, external
; links disabled, etc.) -- sensible when previewing untrusted files.
RestrictMode=0

; 1 = launch Sumatra with -invertcolors (night-reading mode).
; Ignored (together with any per-extension NightMode below) when
; AutoNightMode=1.
NightMode=0

; 1 = follow Total Commander's own Lister light/dark theme instead of a
; fixed NightMode: the plugin relaunches Sumatra with/without
; -invertcolors when TC's dark-mode state changes. Overrides NightMode and
; every per-extension NightMode setting while on. Requires a Total
; Commander version that sends the dark-mode notification (TC 10+).
AutoNightMode=0

; Default zoom passed via -zoom, e.g.: fit page | fit width | fit content | 100 | 150
DefaultZoom=

; Default view mode passed via -view, e.g.: continuous | single page | facing | book view
DefaultView=

; Page-surround background color passed via -bg-color, as a hex RGB value
; (e.g. "2B2B2B" for a dark gray). This is the color of the area AROUND the
; page in continuous-scroll mode, distinct from NightMode/-invertcolors
; (which inverts the page/text content itself, and does NOT have the
; persistence behavior described below). Leave blank for Sumatra's own
; default.
;
; IMPORTANT: -bg-color is one of a small set of SumatraPDF command-line
; options that Sumatra's own documentation describes as writing directly
; into your SumatraPDF-settings.txt (the MainWindowBackground value) --
; every time this plugin launches Sumatra with a BackgroundColor= set, it
; permanently updates that setting, not just the current session. This
; means it also affects how Sumatra looks when you use it standalone,
; outside this plugin, until changed again. Sumatra's docs also mark
; -bg-color itself as deprecated in favor of that same setting, so this
; still works today but isn't guaranteed to in a future SumatraPDF version.
; Leave this blank unless you're fine with that persistent, plugin-external
; side effect.
BackgroundColor=

; SyncTeX / PdfSync inverse-search command, forwarded to -inverse-search.
; It lets Ctrl+clicking a spot in the embedded PDF jump back to the
; matching line of your LaTeX source in your editor. %f is replaced by
; Sumatra with the source file path and %l with the line number. Examples
; (note the SINGLE quotes wrapping each whole value -- see "A NOTE ON
; QUOTES" at the top of this file for why they are required whenever the
; value both starts and ends with a double quote):
;   InverseSearchCommand='"C:\Program Files\Microsoft VS Code\Code.exe" -g "%f":%l'
;   InverseSearchCommand='"C:\Program Files\Notepad++\notepad++.exe" -n%l "%f"'
;   InverseSearchCommand=code.exe -g "%f":%l
;
; IMPORTANT: same persistence behavior as BackgroundColor= above. Sumatra's
; own documentation lists -inverse-search among the options that write
; directly into SumatraPDF-settings.txt on every launch, and marks it as
; deprecated in favor of setting it once in Sumatra's own Settings dialog
; (Ctrl+K in a running Sumatra window). So, while set here, every embedded
; launch permanently updates that global setting -- it also applies when
; you use Sumatra outside this plugin -- and it isn't guaranteed to keep
; working in a future SumatraPDF version. Leave blank unless you're fine
; with that; the command itself is later parsed by Sumatra, which applies
; its OWN quoting rules, separate from this file's.
InverseSearchCommand=

; Comma-separated allowlist of extensions this plugin should claim, e.g.
; "PDF,EPUB,CBZ". Leave blank (default) to keep every extension it
; supports enabled -- this only lets you TRIM the list (e.g. to exclude
; CHM) without recompiling; it can't add extensions Sumatra itself can't
; open. Supported: PDF CHM DJVU EPUB FB2 FB2Z MOBI PRC XPS OXPS CB7 CBR CBT CBZ.
; Caution: a non-blank value that matches nothing (a typo, or entries
; separated by spaces instead of commas) enables NOTHING -- by design.
EnabledExtensions=

; Extra arguments forwarded to -print-settings when printing via this
; plugin's ListPrint support (Total Commander's File > Print on a selected
; file), e.g.: fit | noscale | shrink | landscape | duplex
PrintSettings=

; Controls ListPrint's FALLBACK behavior -- used only when there's no live
; Lister pane already showing the file being printed (the common case
; instead reuses that pane's own Ctrl+P print dialog; see the README).
; 1 = show Sumatra's own interactive print dialog (printer/page-range/
;     copies choice) for the fallback case too; the plugin returns right
;     away rather than waiting for you to finish with it (default).
; 0 = the old silent, non-interactive behavior (-print-to/-print-to-default),
;     which briefly waits for the job to finish before returning -- for
;     scripted/automated printing that can't have a dialog pop up unattended.
InteractivePrintFallback=1

; 1 = supply real first-page thumbnails to Total Commander's Thumbnails
; view via the Windows Shell thumbnail pipeline (no extra Sumatra process
; is started per thumbnail). 0 = no thumbnails from this plugin.
ThumbnailsEnabled=1

; How long (milliseconds) to wait for Sumatra to embed itself into the
; Lister pane before giving up. Clamped to 500..30000. While waiting, the
; pane shows "Opening in SumatraPDF...". Raise this on a slow machine or
; with very large documents.
EmbedTimeoutMs=4000

; 1 = if Sumatra can't be found or fails to embed (or crashes while the
; file is open), open the file with its default Windows application
; instead, in a separate window, in addition to the explanatory message
; shown in the Lister pane. 0 = just show the message.
FallbackToShellOpen=0

; 1 = register a system-wide hotkey (see PopOutHotkey) that reopens the
; current file in a normal, full SumatraPDF window with its menu/toolbar --
; useful for Save As, annotating, rotating, or anything else the embedded
; view doesn't expose. 0 = disabled (default).
; NOTE: the hotkey is effectively system-wide while a Lister pane using this
; plugin is open, not scoped to just that preview having focus, so it can
; shadow the same combination in other applications -- opt in deliberately,
; and use PopOutHotkey to pick a combination nothing else of yours uses.
EnablePopOut=0

; The combination for EnablePopOut=1. Format: one or more modifiers
; (Ctrl, Alt, Shift, Win) plus exactly ONE key, joined with '+': a letter
; A-Z, a digit 0-9, or a function key F1-F24. Case-insensitive. At least
; one modifier is required (a bare key would be swallowed in every other
; program). Examples:  Ctrl+Alt+O   Ctrl+Shift+F9   Win+Alt+P
; An invalid value falls back to Ctrl+Alt+O (noted in the debug log). If
; another program already owns the combination, registration fails quietly
; (also noted in the debug log) -- pick a different one here.
PopOutHotkey=Ctrl+Alt+O

; 1 = register a system-wide hotkey (see DiagnosticHotkey) that copies a
; diagnostic snapshot to the clipboard -- plugin version, detected
; SumatraPDF path and version, effective settings, and a recent log tail if
; DebugLog=1. Never includes a deep link's pwd or search value, and shows
; InverseSearchCommand only as set/not set. Handy for pasting into a bug
; report. 0 = disabled (default). Same system-wide caveat as EnablePopOut.
EnableDiagnosticHotkey=0

; The combination for EnableDiagnosticHotkey=1; same format and rules as
; PopOutHotkey. An invalid value falls back to Ctrl+Alt+D.
DiagnosticHotkey=Ctrl+Alt+D

; 1 = write SumatraLister.log next to this INI with detection/launch details
; (useful for troubleshooting "Sumatra could not be found" messages). The
; log auto-rotates (starts fresh) once it passes ~2MB.
DebugLog=0

; ---------------------------------------------------------------------------
; Per-extension overrides (optional)
; ---------------------------------------------------------------------------
; An [EXT] section (extension name, no dot -- PDF, EPUB, CBZ, CBR, CB7, CBT,
; CHM, DJVU, FB2, FB2Z, MOBI, PRC, XPS, OXPS) overrides DefaultZoom/
; DefaultView/NightMode from [Settings] for files of that extension only.
; Any key you don't set in the section falls back to the [Settings] value
; above. (AutoNightMode=1 overrides every static NightMode, including these.)
; Comics and PDFs, for example, often want different defaults:
;
; [CBZ]
; DefaultView=continuous
; DefaultZoom=fit width
;
; [CBR]
; DefaultView=continuous
; DefaultZoom=fit width
;
; [PDF]
; DefaultView=single page
; DefaultZoom=fit page
